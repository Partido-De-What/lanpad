name: Receiver

on:
  push:
    paths:
      - receiver/**
      - .github/workflows/receiver.yml
  pull_request:
    paths:
      - receiver/**
      - .github/workflows/receiver.yml

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install receiver and development dependencies
        run: python -m pip install -e "./receiver[dev]"
      - name: Test protocol, native adapters and WebSocket lifecycle
        run: python -m pytest -q receiver/tests
      - name: Lint receiver
        run: python -m ruff check receiver
