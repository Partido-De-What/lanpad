[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lanpad-desktop"
version = "0.1.0"
description = "Paired Android touchpad receiver for Linux with X11"
requires-python = ">=3.12"
dependencies = ["websockets>=15,<18", "python-xlib>=0.33,<0.34", "zeroconf>=0.146,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
lanpad = "lanpad.cli:main"
lanpad-client = "lanpad.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
